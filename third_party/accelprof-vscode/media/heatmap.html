<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>AccelProf Heatmap</title>
<style>
  :root {
    --bg: var(--vscode-editor-background, #1e1e1e);
    --fg: var(--vscode-editor-foreground, #d4d4d4);
    --border: var(--vscode-panel-border, #444);
    --header-bg: var(--vscode-editorGroupHeader-tabsBackground, #252526);
    --hover-bg: var(--vscode-list-hoverBackground, #2a2d2e);
    --link: var(--vscode-textLink-foreground, #4ec9b0);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--vscode-editor-font-family, 'Consolas', 'Courier New', monospace);
    font-size: 12px;
    padding: 8px;
  }
  h1 { font-size: 14px; margin-bottom: 8px; }
  #summary { margin-bottom: 8px; color: #aaa; }
  #controls { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  #controls label { color: #aaa; }
  #search {
    background: var(--header-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 2px 6px;
    font-family: inherit;
    font-size: 12px;
    width: 200px;
  }
  #colorBy {
    background: var(--header-bg);
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 2px 4px;
    font-family: inherit;
    font-size: 12px;
  }
  #legend { display: flex; align-items: center; gap: 4px; }
  #legend-bar {
    width: 120px; height: 12px;
    background: linear-gradient(to right, #1e3a5f, #0d6efd, #ffc107, #dc3545);
  }
  .legend-label { font-size: 11px; color: #aaa; }

  .scroll-wrap { overflow: auto; max-height: calc(100vh - 100px); }
  table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--header-bg);
    border: 1px solid var(--border);
    padding: 2px 4px;
    white-space: nowrap;
    text-align: center;
    font-weight: bold;
    font-size: 11px;
    z-index: 2;
  }
  thead th:first-child { text-align: left; z-index: 3; left: 0; }
  tbody td {
    border: 1px solid var(--border);
    padding: 1px 3px;
    white-space: nowrap;
    text-align: right;
    font-size: 11px;
  }
  tbody td:first-child {
    position: sticky;
    left: 0;
    background: var(--bg);
    text-align: left;
    font-family: monospace;
    z-index: 1;
  }
  tbody tr:hover td { background: var(--hover-bg); }
  tbody tr:hover td:first-child { background: var(--hover-bg); }

  .pc-link {
    color: var(--link);
    cursor: pointer;
    text-decoration: underline;
  }
  .pc-link:hover { opacity: 0.8; }

  #loading { text-align: center; padding: 20px; color: #aaa; }
</style>
</head>
<body>
<!-- DATA_INJECTION -->
<h1>AccelProf Heatmap</h1>
<div id="summary">Loading…</div>
<div id="controls">
  <label>Filter sector: <input id="search" type="text" placeholder="0x…"></label>
  <label>Color by:
    <select id="colorBy">
      <option value="warp">Whole-sector warp count</option>
      <option value="access">Whole-sector access count</option>
    </select>
  </label>
  <div id="legend">
    <span class="legend-label">low</span>
    <div id="legend-bar"></div>
    <span class="legend-label">high</span>
  </div>
</div>
<div class="scroll-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th>Sector Tag</th>
        <th>W0</th><th>W1</th><th>W2</th><th>W3</th>
        <th>W4</th><th>W5</th><th>W6</th><th>W7</th>
        <th>Warps</th>
        <th>A0</th><th>A1</th><th>A2</th><th>A3</th>
        <th>A4</th><th>A5</th><th>A6</th><th>A7</th>
        <th>Accesses</th>
        <th>Touched PCs</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="loading">Rendering…</div>
</div>

<script>
(function() {
  'use strict';

  // HEATMAP_DATA is injected by the extension
  const data = (typeof HEATMAP_DATA !== 'undefined') ? HEATMAP_DATA : [];

  const vscode = acquireVsCodeApi();

  // ── Heat coloring ────────────────────────────────────────────────────────
  // Color stops: dark blue → blue → yellow → red
  const STOPS = [
    [30, 58, 95],    // #1e3a5f  (low)
    [13, 110, 253],  // #0d6efd
    [255, 193, 7],   // #ffc107
    [220, 53, 69]    // #dc3545  (high)
  ];

  function lerpColor(t) {
    // t in [0,1]
    t = Math.max(0, Math.min(1, t));
    const seg = (STOPS.length - 1) * t;
    const i = Math.min(Math.floor(seg), STOPS.length - 2);
    const f = seg - i;
    const a = STOPS[i], b = STOPS[i + 1];
    const r = Math.round(a[0] + f * (b[0] - a[0]));
    const g = Math.round(a[1] + f * (b[1] - a[1]));
    const bv = Math.round(a[2] + f * (b[2] - a[2]));
    // Choose white/black text for contrast
    const lum = 0.299 * r + 0.587 * g + 0.114 * bv;
    const fg = lum > 140 ? '#000' : '#fff';
    return { bg: `rgb(${r},${g},${bv})`, fg };
  }

  // ── State ────────────────────────────────────────────────────────────────
  let colorMode = 'warp'; // 'warp' | 'access'
  let filterText = '';
  let maxWarp = 1;
  let maxAccess = 1;

  for (const row of data) {
    maxWarp = Math.max(maxWarp, row.warpCounts[8]);
    maxAccess = Math.max(maxAccess, row.accessCounts[8]);
  }

  // ── DOM rendering ────────────────────────────────────────────────────────
  const tbody = document.getElementById('tbody');
  const loading = document.getElementById('loading');
  const summary = document.getElementById('summary');

  function getMax() {
    return colorMode === 'warp' ? maxWarp : maxAccess;
  }

  function getHeatValue(row) {
    return colorMode === 'warp' ? row.warpCounts[8] : row.accessCounts[8];
  }

  function buildRow(row) {
    const tr = document.createElement('tr');
    const m = getMax();
    const val = getHeatValue(row);
    const { bg, fg } = lerpColor(m > 0 ? val / m : 0);

    // Sector tag
    const tdSector = document.createElement('td');
    tdSector.textContent = row.sectorTag;
    tr.appendChild(tdSector);

    // 8 per-warp counts + whole-sector (heat colored)
    for (let i = 0; i < 8; i++) {
      const td = document.createElement('td');
      td.textContent = row.warpCounts[i];
      tr.appendChild(td);
    }
    const tdWholeW = document.createElement('td');
    tdWholeW.textContent = row.warpCounts[8];
    if (colorMode === 'warp') {
      tdWholeW.style.background = bg;
      tdWholeW.style.color = fg;
    }
    tr.appendChild(tdWholeW);

    // 8 per-warp access counts + whole-sector
    for (let i = 0; i < 8; i++) {
      const td = document.createElement('td');
      td.textContent = row.accessCounts[i];
      tr.appendChild(td);
    }
    const tdWholeA = document.createElement('td');
    tdWholeA.textContent = row.accessCounts[8];
    if (colorMode === 'access') {
      tdWholeA.style.background = bg;
      tdWholeA.style.color = fg;
    }
    tr.appendChild(tdWholeA);

    // PCs
    const tdPc = document.createElement('td');
    for (const pc of row.touchedPcs) {
      const span = document.createElement('span');
      span.className = 'pc-link';
      span.textContent = pc;
      span.title = 'Click to map PC to source';
      span.addEventListener('click', () => {
        vscode.postMessage({ command: 'mapPc', pc });
      });
      tdPc.appendChild(span);
      tdPc.appendChild(document.createTextNode(' '));
    }
    tr.appendChild(tdPc);

    return tr;
  }

  let rendered = 0;
  const BATCH = 200;

  function getVisibleData() {
    if (!filterText) return data;
    return data.filter(r => r.sectorTag.includes(filterText));
  }

  function renderAll() {
    tbody.innerHTML = '';
    rendered = 0;
    const visible = getVisibleData();
    summary.textContent = `${visible.length} sector(s)  |  max warps: ${maxWarp}  |  max accesses: ${maxAccess}`;

    function renderBatch() {
      const end = Math.min(rendered + BATCH, visible.length);
      const frag = document.createDocumentFragment();
      while (rendered < end) {
        frag.appendChild(buildRow(visible[rendered]));
        rendered++;
      }
      tbody.appendChild(frag);
      if (rendered < visible.length) {
        loading.style.display = 'block';
        loading.textContent = `Rendering… ${rendered}/${visible.length}`;
        requestAnimationFrame(renderBatch);
      } else {
        loading.style.display = 'none';
      }
    }

    renderBatch();
  }

  // ── Controls ─────────────────────────────────────────────────────────────
  document.getElementById('search').addEventListener('input', function() {
    filterText = this.value.trim();
    renderAll();
  });

  document.getElementById('colorBy').addEventListener('change', function() {
    colorMode = this.value;
    renderAll();
  });

  // ── Initial render ────────────────────────────────────────────────────────
  if (data.length === 0) {
    loading.textContent = 'No data.';
    summary.textContent = '0 sectors';
  } else {
    renderAll();
  }
})();
</script>
</body>
</html>
